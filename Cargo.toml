[package]
name = "epdg"
version = "0.1.0"
edition = "2024"

[dependencies]
aes = "0.8"
cbc = "0.1"
cipher = "0.4"
env_logger = "0.11"
hex = "0.4"
hmac = "0.12"
log = "0.4"
num-bigint = { version = "0.4", features = ["rand"] }
num-traits = "0.2"
openssl = "0.10"
plist = "1"
rand = "0.8"
sha1 = "0.10"
sha2 = "0.10"
smoltcp = { version = "0.14", default-features = false, features = ["std", "log", "medium-ip", "proto-ipv4", "proto-ipv6", "proto-ipv4-fragmentation", "proto-ipv6-fragmentation", "socket-udp", "socket-tcp", "socket-dns", "socket-icmp"] }
subtle = "2"
thiserror = "2"
zeroize = { version = "1", features = ["zeroize_derive"] }

[dev-dependencies]
env_logger = "0.11"

[features]
vendored = ["openssl/vendored"]
